<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="login-card">
      <!-- Top Header Banner -->
      <div class="card-header">
        <div class="logo-box">
          <img
            src="https://cdn.all-for-one.com/corporate-media/company/pr-und-news/bildarchiv/all-for-one-group-se-de-100424.png"
            alt="All For One Group Logo"
            class="brand-logo"
          />
        </div>
        <div class="header-text">
          <span class="brand-title">TalentGrid</span>
          <span class="brand-sub">HR SOLUTIONS</span>
        </div>
      </div>

      <!-- Main Form Content -->
      <div class="card-body">
        <h2 class="title">Welcome</h2>
        <p class="subtitle">Register for a new account</p>

        <form id="register-form">
          <!-- First Name Input -->
          <div class="input-group">
            <i class="fa-regular fa-user input-icon"></i>
            <input
              type="text"
              id="first-name"
              placeholder="First Name"
              required
            />
          </div>

          <!-- Last Name Input -->
          <div class="input-group">
            <i class="fa-regular fa-user input-icon"></i>
            <input
              type="text"
              id="last-name"
              placeholder="Last Name"
              required
            />
          </div>

          <!-- Email Input -->
          <div class="input-group">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input
              type="email"
              id="email"
              placeholder="Email Address"
              required
            />
          </div>

          <!-- Password Input -->
          <div class="input-group">
            <i class="fa-solid fa-lock input-icon"></i>
            <input
              type="password"
              id="password"
              placeholder="Password"
              required
            />
            <i class="fa-regular fa-eye toggle-password"></i>
          </div>

          <!-- Confirm Password Input -->
          <div class="input-group">
            <i class="fa-solid fa-lock input-icon"></i>
            <input
              type="password"
              id="confirm-password"
              placeholder="Confirm Password"
              required
            />
            <i class="fa-regular fa-eye toggle-password"></i>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-primary">Sign Up</button>
        </form>
      </div>
    </div>
  </body>
</html>
