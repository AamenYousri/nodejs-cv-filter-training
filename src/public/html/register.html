<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <script>
      function getCookie(name) {
        const match = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/([.$?*|{}\(\)\[\]\\/\+\^])/g, '\\$1') + '=([^;]*)'));
        return match ? decodeURIComponent(match[1]) : null;
      }

      function clearInvalidToken() {
        document.cookie = 'accessToken=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
      }

      function decodeJwtPayload(token) {
        if (!token) return null;

        try {
          const payload = token.split('.')[1];
          const normalized = payload.replace(/-/g, '+').replace(/_/g, '/');
          const decoded = JSON.parse(atob(normalized));

          if (!decoded || !decoded.email) {
            return null;
          }

          return decoded;
        } catch (error) {
          return null;
        }
      }

      const token = getCookie('accessToken');
      if (token) {
        const payload = decodeJwtPayload(token);

        if (!payload) {
          clearInvalidToken();
        } else if (payload.is_verified === false) {
          window.location.href = '/otp-verification';
        } else {
          window.location.href = '/dashboard';
        }
      }
    </script>

    <div class="login-card">
      <!-- Top Header Banner -->
      <div class="card-header">
        <div class="logo-box">
          <img
            src="https://cdn.all-for-one.com/corporate-media/company/pr-und-news/bildarchiv/all-for-one-group-se-de-100424.png"
            alt="All For One Group Logo"
            class="brand-logo"
          />
        </div>
        <div class="header-text">
          <span class="brand-title">TalentGrid</span>
          <span class="brand-sub">HR SOLUTIONS</span>
        </div>
      </div>

      <!-- Main Form Content -->
      <div class="card-body">
        <h2 class="title">Welcome</h2>
        <p class="subtitle">Register for a new account</p>

        <form id="register-form">
          <!-- First Name Input -->
          <div class="input-group">
            <i class="fa-regular fa-user input-icon"></i>
            <input
              style="padding-left: 12px"
              type="text"
              id="first-name"
              placeholder="First Name"
              required
            />
          </div>

          <!-- Last Name Input -->
          <div class="input-group">
            <i class="fa-regular fa-user input-icon"></i>
            <input
              style="padding-left: 12px"
              type="text"
              id="last-name"
              placeholder="Last Name"
              required
            />
          </div>

          <!-- Email Input -->
          <div class="input-group">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input
              style="padding-left: 12px"
              type="email"
              id="email"
              placeholder="Email Address"
              required
            />
          </div>

          <!-- Password Input -->
          <div class="input-group">
            <i class="fa-solid fa-lock input-icon"></i>
            <input
              style="padding-left: 12px"
              type="password"
              id="password"
              placeholder="Password"
              required
            />
            <i class="fa-regular fa-eye toggle-password"></i>
          </div>

          <!-- Confirm Password Input -->
          <div class="input-group">
            <i class="fa-solid fa-lock input-icon"></i>
            <input
              style="padding-left: 12px"
              type="password"
              id="confirm-password"
              placeholder="Confirm Password"
              required
            />
            <i class="fa-regular fa-eye toggle-password"></i>
          </div>

          

          <!-- Submit Button -->
          <button type="submit" class="btn-primary">Sign Up</button>
        </form>
        <p class="signup-text">
          Already have an account? <a href="/login">Login</a>
        </p>

        <p class="msg hidden" id="register-msg"></p>
      </div>
    </div>

    <script src="/js/register.js"></script>
  </body>
</html>
