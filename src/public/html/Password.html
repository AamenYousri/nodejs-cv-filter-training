<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TalentGrid - Employer Login</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/theme-variables.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="login-card">
         <div class="card-header">
                <div class="logo-box">
                        <img 
                    src="https://cdn.all-for-one.com/corporate-media/company/pr-und-news/bildarchiv/all-for-one-group-se-de-100424.png" 
                    alt="All For One Group Logo" 
                    class="brand-logo"/>
                </div>
                    <div class="header-text">
                        <span class="brand-title">TalentGrid</span>
                        <span class="brand-sub">HR SOLUTIONS</span>
                    </div>
                </div>
                <form id="login-form">

      <div class="card-body">
        <div class="input-group">
          <input style="padding-left: 12px;" type="email" id="email" placeholder="New Password" required />
        </div>
        
        
      </form>

        <div class="input-group">
          <input style="padding-left: 12px;" type="4 digit code" id="otp" placeholder="Confirm Password" required />
        </div>
        <button type="submit" class="btn-primary">Confirm</button>
      </form>
      <p class="msg hidden" id="login-msg"></p>
      </div>
    </div>

</body>
