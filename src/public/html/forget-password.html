<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TalentGrid - Employer Login</title>
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="login-card">
      <!-- Top Header Banner -->
      <div class="card-header">
        <a class="back-button" href="/login" title="Back to login">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="logo-box">
          <img
            src="https://cdn.all-for-one.com/corporate-media/company/pr-und-news/bildarchiv/all-for-one-group-se-de-100424.png"
            alt="All For One Group Logo"
            class="brand-logo"
          />
        </div>
        <div class="header-text">
          <span class="brand-title">TalentGrid</span>
          <span class="brand-sub">HR SOLUTIONS</span>
        </div>
      </div>

      <!-- Main Form Content -->
      <div class="card-body">
        <h2 class="title" id="form-title">Forgot your password?</h2>
        <p class="subtitle" id="form-subtitle">
          Enter your email and we'll send you a 6-digit reset code.
        </p>

        <form id="forgot-password-form" novalidate>
          <!-- Email Input -->
          <div class="input-group">
            <input
              style="padding-left: 12px"
              type="email"
              id="email"
              placeholder="Your Email"
              required
            />
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-primary" id="send-code-button">Send Code</button>

          <div id="reset-fields" class="hidden">
            <div class="input-group">
              <input
                style="padding-left: 12px"
                type="text"
                id="reset-code"
                placeholder="6-Digit Code"
                inputmode="numeric"
                maxlength="6"
              />
            </div>

            <div class="input-group">
              <input
                style="padding-left: 12px"
                type="password"
                id="new-password"
                placeholder="New Password"
                autocomplete="new-password"
              />
            </div>

            <div class="input-group">
              <input
                style="padding-left: 12px"
                type="password"
                id="confirm-password"
                placeholder="Confirm New Password"
                autocomplete="new-password"
              />
            </div>

            <button type="button" class="btn-primary" id="reset-password-button">
              Reset Password
            </button>
          </div>
        </form>
        <p class="msg hidden" id="login-msg"></p>
      </div>
    </div>
    <script src="../js/forgot-password.js"></script>
  </body>
</html>
