<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TalentGrid - Employer Login</title>
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-card">
      <!-- Top Header Banner -->
      <div class="card-header">
        <div class="logo-box">
          <img
            src="https://cdn.all-for-one.com/corporate-media/company/pr-und-news/bildarchiv/all-for-one-group-se-de-100424.png"
            alt="All For One Group Logo"
            class="brand-logo"
          />
        </div>
        <div class="header-text">
          <span class="brand-title">Reset Your Password</span>
        </div>
      </div>

      <!-- Main Form Content -->
      <div class="card-body">
        <h2 class="title">
          Forgot your password? Enter your email so we can send your 4 digit
          code
        </h2>

        <form id="login-form">
          <!-- Email Input -->
          <form id="login-form">
            <div class="input-group">
              <input
                style="padding-left: 12px"
                type="email"
                id="email"
                placeholder=" Your Email"
                required
              />
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-primary">Get Code</button>
          </form>

          <!-- code Input -->
          <div class="input-group">
            <input
              style="padding-left: 12px"
              type="4 digit code"
              id="otp"
              placeholder="4-Digit Code"
              required
            />
          </div>
          <!-- Submit Button -->
          <button type="submit" class="btn-primary">Submit Code</button>
        </form>
        <p class="msg hidden" id="login-msg"></p>
      </div>
    </div>
  </body>
</html>
