<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TalentGrid - Employer Login</title>
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <script>
      function getCookie(name) {
        const match = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/([.$?*|{}\(\)\[\]\\/\+\^])/g, '\\$1') + '=([^;]*)'));
        return match ? decodeURIComponent(match[1]) : null;
      }

      if (!getCookie('accessToken')) {
        window.location.href = '/login';
      }
    </script>

    <div class="login-card">
      <!-- Top Header Banner -->
      <div class="card-header">
        <div class="logo-box">
          <img
            src="https://cdn.all-for-one.com/corporate-media/company/pr-und-news/bildarchiv/all-for-one-group-se-de-100424.png"
            alt="All For One Group Logo"
            class="brand-logo"
          />
        </div>
        <div class="header-text">
          <span class="brand-title">Verify Your Identity</span>
        </div>
      </div>

      <!-- Main Form Content -->
      <div class="card-body">
        <h2 class="title" id="email-text">
          Enter the code sent to your email mohamedebrahim4415@gmail.com
        </h2>

        <form id="otp-form">
          <!-- code Input -->
          <div class="input-group">
            <input
              style="padding-left: 12px"
              type="text"
              id="otp"
              placeholder="6-Digit Code"
              maxlength="6"
              required
            />
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-primary">Submit</button>
        </form>

        <!-- Sign Up Footer -->
        <p class="signup-text">
          Don’t receive a code?
          <a href="#" id="resend-otp-link">Resend Code</a>
        </p>

        <p class="msg hidden" id="login-msg"></p>
      </div>
    </div>
    <script src="../css/login.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const otpForm = document.getElementById('otp-form');
        const otpInput = document.getElementById('otp');
        const messageEl = document.getElementById('login-msg');
        const emailTextEl = document.getElementById('email-text');
        const resendLink = document.getElementById('resend-otp-link');

        function getCookie(name) {
          const match = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/([.$?*|{}\(\)\[\]\\/\+\^])/g, '\\$1') + '=([^;]*)'));
          return match ? decodeURIComponent(match[1]) : null;
        }

        function decodeJwtEmail(token) {
          if (!token) return null;

          try {
            const payload = token.split('.')[1];
            const normalized = payload.replace(/-/g, '+').replace(/_/g, '/');
            const decoded = JSON.parse(atob(normalized));
            return decoded.email || null;
          } catch (error) {
            return null;
          }
        }

        const email = decodeJwtEmail(getCookie('accessToken'));
        if (email) {
          emailTextEl.textContent = `Enter the code sent to your email ${email}`;
        } else {
          emailTextEl.textContent = 'Enter the code sent to your email';
        }

        function showMessage(text, type = 'error') {
          if (!messageEl) return;
          messageEl.textContent = text;
          messageEl.classList.remove('hidden', 'error', 'success');
          messageEl.classList.add(type);
        }

        async function resendOTP() {
          const token = getCookie('accessToken');
          const email = decodeJwtEmail(token);

          if (!email) {
            showMessage('Your session is missing. Please log in again.');
            return;
          }

          try {
            const response = await fetch('/api/auth/resend-otp', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email }),
            });

            const data = await response.json();

            if (!response.ok) {
              showMessage(data?.error || 'Unable to resend OTP. Please try again.');
              return;
            }

            showMessage('A new OTP has been sent to your email.', 'success');
            if (resendLink) {
              resendLink.textContent = 'Sent';
              resendLink.style.pointerEvents = 'none';
              resendLink.style.opacity = '0.7';
            }
          } catch (error) {
            console.error('Resend OTP error:', error);
            showMessage('Something went wrong while resending the OTP.');
          }
        }

        if (resendLink) {
          resendLink.addEventListener('click', (event) => {
            event.preventDefault();
            resendOTP();
          });
        }

        otpForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const otp = otpInput.value.trim();
          const token = getCookie('accessToken');
          const email = decodeJwtEmail(token);

          if (!otp) {
            showMessage('Please enter the verification code.');
            otpInput.focus();
            return;
          }

          if (!email) {
            showMessage('Your session is missing. Please log in again.');
            return;
          }

          try {
            const response = await fetch('/api/auth/verify-otp', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, otp }),
            });

            const data = await response.json();

            if (!response.ok) {
              showMessage(data?.error || 'Invalid OTP. Please try again.');
              return;
            }

            if (data?.token) {
              document.cookie = `accessToken=${encodeURIComponent(data.token)}; path=/; max-age=${10 * 24 * 60 * 60}; SameSite=Lax`;
            }

            showMessage('OTP verified successfully.', 'success');
            window.location.href = '/dashboard';
          } catch (error) {
            console.error('OTP verification error:', error);
            showMessage('Something went wrong. Please try again.');
          }
        });
      });
    </script>
  </body>
</html>
