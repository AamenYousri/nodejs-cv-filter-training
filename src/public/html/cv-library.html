<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentGrid - Dashboard</title>
    <link rel="stylesheet" href="../css/sidebar.css">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/candidate_list.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="../css/filter-and-search.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="main-sidebar-container">

            <button
    class="btn sidebar-toggle d-lg-none"
    type="button"
    data-bs-toggle="offcanvas"
    data-bs-target="#mobileSidebar">

    <i class="fa-solid fa-bars"></i>
</button>

<!-- Desktop Sidebar -->
<div
    id="desktop-sidebar"
    class="d-none d-lg-block"
    data-active-page="library">
</div>

<!-- Mobile Sidebar -->

<div
    class="offcanvas offcanvas-start p-0"
    tabindex="-1"
    id="mobileSidebar">

    <div
        id="mobile-sidebar"
        data-active-page="library">
    </div>
</div>

<!-- Content -->

<div id="sidebar-container"
     data-active-page="library">
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="../js/Sidebar.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const { UserService, TokenStorage, Sidebar } = window;

  if (!UserService || !TokenStorage || !Sidebar) {
    console.error('Sidebar dependencies are not loaded.');
    return;
  }

  const userService = new UserService();

  const desktopSidebar = new Sidebar('desktop-sidebar', userService, TokenStorage);
  const mobileSidebar = new Sidebar('mobile-sidebar', userService, TokenStorage);

  desktopSidebar.render();
  mobileSidebar.render();

  const mobileSidebarEl = document.getElementById('mobileSidebar');
  const toggleBtn = document.querySelector('.sidebar-toggle');

  if (!mobileSidebarEl || !toggleBtn) return;

  mobileSidebarEl.addEventListener('shown.bs.offcanvas', () => {
    toggleBtn.classList.add('open');
  });

  mobileSidebarEl.addEventListener('hidden.bs.offcanvas', () => {
    toggleBtn.classList.remove('open');
    toggleBtn.blur();
  });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (window.innerWidth >= 992 && window.bootstrap) {
        const offcanvasInstance = bootstrap.Offcanvas.getInstance(mobileSidebarEl);
        if (offcanvasInstance) {
          offcanvasInstance.hide();
        }
      }
    }, 150);
  });
});
</script>
</body>

        </div>
        <div class="main-content-container">
            <div class="dashboard-filteration">
              <div class="filter-section">
      <!-- =================================
         HEADER
    ================================== -->

      <div class="filter-header">
        <!-- Filter Title -->

        <div class="filter-title">
          <span>Filter</span>

          <i class="fa-solid fa-filter"></i>
        </div>

        <!-- Search Candidates -->

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>

          <input
            type="text"
            id="candidateSearch"
            placeholder="Search CV's..."
            autocomplete="off"
          />
        </div>
      </div>

      <!-- =================================
         FILTERS
    ================================== -->
      <div class="filters-container">
        <!-- =================================
             EXPERIENCE
        ================================== -->

        <div class="multi-filter" data-filter="date">
          <div class="filter-input">
            <i class="fa-regular fa-clock filter-icon"></i>

            <!-- Selected Values -->

            <div class="selected-items"></div>

            <!-- Write Custom Value -->

            <input
              type="date"
              class="multi-input"
              placeholder="Date"
              autocomplete="off"
            />

            <i class="fa-solid fa-chevron-down arrow"></i>
          </div>

          <!-- Date Search -->

          <div class="dropdown">
            <!-- Dropdown Search -->

            <div class="dropdown-search">
              <i class="fa-solid fa-magnifying-glass"></i>

              <input
                type="text"
                placeholder="Search Date"
                autocomplete="off"
              />
            </div>

            <!-- Experience List -->

            <div class="options-list">
            </div>
          </div>
        </div>

        <!-- =================================
             STATUS
        ================================== -->

        <div class="multi-filter" data-filter="status">
          <div class="filter-input">
            <i class="fa-solid fa-code filter-icon"></i>

            <!-- Selected Values -->

            <div class="selected-items"></div>

            <!-- Write Custom Value -->

            <input
              type="text"
              class="multi-input"
              placeholder="Status"
              autocomplete="off"
            />

            <i class="fa-solid fa-chevron-down arrow"></i>
          </div>

          <!-- Skills Dropdown -->

          <div class="dropdown">
            <!-- Dropdown Search -->
            <div class="options-list">
              <div class="option">Accepted</div>

              <div class="option">Review</div>

              <div class="option">Rejected</div>

              <div class="option">Done</div>
            </div>
          </div>
        </div>
      </div>

      <!-- =================================
         BUTTONS
    ================================== -->

      <div class="filter-actions">
        <!-- Filter Button -->

        <button type="button" id="applyFilterBtn" class="apply-filter-btn">
          <i class="fa-solid fa-filter"></i>

          Filter
        </button>

        <!-- Clear Button -->

        <button type="button" id="clearFilterBtn" class="clear-filter-btn">
          Clear
        </button>
      </div>
    </div>

    <!-- JavaScript -->

    <script src="../js/library-filter.js"></script>
            </div>
            <div class="dashboard-candidate-table-container">

    <h2 class="dashboard-candidate-title">CV Library</h2>

    <table class="dashboard-candidate-table">

        <thead>
            <tr>
                <th>Name <i class="fa-solid fa-chevron-down"></i></th>
                <th>Filename <i class="fa-solid fa-chevron-down"></i></th>
                <th>Doc type <i class="fa-solid fa-chevron-down"></i></th>
                <th>Date<i class="fa-solid fa-chevron-down"></i></th>
                <th>Status <i class="fa-solid fa-chevron-down"></i></th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="candidates-tbody">
            <!-- Rows will be rendered dynamically by candidates-list.js -->
        </tbody>

    </table>

</div>

<script src="../js/cv-list.js"></script>
        </div>

    </div>

    <div id="uploadModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="uploadModalTitle">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <span class="modal-eyebrow">Candidate management</span>
            <h2 id="uploadModalTitle">Upload CVs</h2>
          </div>
          <button id="closeUploadModal" class="modal-close" type="button" aria-label="Close upload dialog">&times;</button>
        </div>
        <div class="modal-body">
          <p class="upload-description">Add one or more candidate CVs. Supported formats: PDF, DOC, and DOCX.</p>
          <label class="file-dropzone" for="cvFiles">
            <i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i>
            <span class="file-dropzone-title">Choose files to upload</span>
            <span class="file-dropzone-hint">or drag and drop them here</span>
            <input type="file" id="cvFiles" accept=".pdf,.doc,.docx" multiple>
          </label>
          <div id="selectedFiles" class="selected-files" aria-live="polite"></div>
          <p id="uploadStatus" class="upload-status" role="status" aria-live="polite"></p>
          <div class="modal-actions">
            <button id="cancelUploadBtn" class="upload-cancel" type="button">Cancel</button>
            <button id="uploadCvBtn" class="upload-submit" type="button"><span class="button-label">Upload CVs</span><span class="upload-spinner" aria-hidden="true"></span></button>
          </div>
        </div>
      </div>
    </div>
<script src="../js/upload-modal.js"></script>

</body>
</html>
